<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter,system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece7df"/><stop offset="1" stop-color="#ddd5c8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28435c"/><stop offset="1" stop-color="#14202c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b489"/><stop offset="1" stop-color="#c39d6e"/>
    </linearGradient>
  </defs>

  <!-- wall + floor -->
  <rect x="0" y="0" width="1200" height="560" fill="url(#wall)"/>
  <rect x="0" y="560" width="1200" height="200" fill="#b98f63"/>
  <g stroke="#a87f55" stroke-width="2" opacity=".5">
    <line x1="0" y1="610" x2="1200" y2="610"/><line x1="0" y1="665" x2="1200" y2="665"/><line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="300" y1="560" x2="300" y2="760"/><line x1="720" y1="560" x2="720" y2="760"/><line x1="1040" y1="560" x2="1040" y2="760"/>
  </g>
  <!-- rug -->
  <ellipse cx="620" cy="690" rx="430" ry="56" fill="#cfc7b6" opacity=".9"/>

  <!-- wall shelf (upper-left) -->
  <rect x="120" y="240" width="300" height="16" rx="3" fill="#caa877"/>
  <rect x="120" y="256" width="300" height="6" fill="#00000022"/>
  <!-- books on shelf -->
  <rect x="150" y="196" width="18" height="44" fill="#c0563f"/>
  <rect x="170" y="188" width="16" height="52" fill="#d9a441"/>
  <rect x="188" y="200" width="18" height="40" fill="#4a6c8f"/>
  <rect x="208" y="192" width="14" height="48" fill="#6a7f5a"/>
  <!-- plant on shelf -->
  <rect x="350" y="206" width="40" height="34" rx="4" fill="#c56b4a"/>
  <path d="M370 206 C360 170 345 165 352 150 C360 168 372 170 370 150 C382 166 388 180 380 206 Z" fill="#5f9a5f"/>
  <path d="M370 206 C380 176 396 172 392 156 C398 176 388 190 370 206 Z" fill="#4f864f"/>

  <!-- framed art on wall -->
  <rect x="560" y="150" width="170" height="130" rx="4" fill="#ffffff" stroke="#3f3f3f" stroke-width="6"/>
  <rect x="574" y="164" width="142" height="102" fill="#dfe6ea"/>
  <path d="M574 266 L620 210 L652 240 L690 196 L716 266 Z" fill="#b7c3cb"/>
  <circle cx="686" cy="186" r="12" fill="#e9c66a"/>

  <!-- desk lamp (right of desk) -->
  <g stroke="#3b3b3b" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="980" y1="440" x2="980" y2="372"/>
    <line x1="980" y1="372" x2="1038" y2="336"/>
  </g>
  <ellipse cx="980" cy="442" rx="26" ry="8" fill="#3b3b3b"/>
  <path d="M1018 320 l40 0 l-8 30 l-24 0 z" fill="#f0ede6" stroke="#cfcabf" stroke-width="2"/>

  <!-- desk -->
  <rect x="440" y="438" width="600" height="24" rx="5" fill="url(#wood)"/>
  <rect x="440" y="462" width="600" height="8" fill="#00000026"/>
  <rect x="470" y="462" width="16" height="218" fill="#2f2f2f"/>
  <rect x="994" y="462" width="16" height="218" fill="#2f2f2f"/>

  <!-- monitor -->
  <rect x="648" y="300" width="230" height="138" rx="8" fill="#232323"/>
  <rect x="660" y="312" width="206" height="114" rx="4" fill="url(#screen)"/>
  <rect x="690" y="340" width="150" height="10" rx="3" fill="#ffffff22"/>
  <rect x="690" y="360" width="110" height="8" rx="3" fill="#ffffff18"/>
  <rect x="690" y="378" width="130" height="8" rx="3" fill="#ffffff14"/>
  <rect x="756" y="438" width="14" height="22" fill="#3a3a3a"/>
  <rect x="726" y="460" width="74" height="8" rx="3" fill="#2b2b2b"/>
  <!-- keyboard + mouse -->
  <rect x="610" y="470" width="150" height="20" rx="4" fill="#2b2b2b"/>
  <ellipse cx="800" cy="482" rx="14" ry="9" fill="#2b2b2b"/>

  <!-- office chair (front-left) -->
  <g>
    <rect x="300" y="330" width="120" height="150" rx="22" fill="#9aa0a8"/>
    <rect x="312" y="345" width="96" height="120" rx="16" fill="#aeb4bb"/>
    <rect x="300" y="470" width="140" height="40" rx="14" fill="#7f858d"/>
    <rect x="356" y="508" width="12" height="70" fill="#2f2f2f"/>
    <g stroke="#2f2f2f" stroke-width="12" stroke-linecap="round">
      <line x1="362" y1="576" x2="300" y2="612"/><line x1="362" y1="576" x2="424" y2="612"/><line x1="362" y1="576" x2="362" y2="624"/>
    </g>
    <circle cx="300" cy="616" r="9" fill="#1f1f1f"/><circle cx="424" cy="616" r="9" fill="#1f1f1f"/><circle cx="362" cy="628" r="9" fill="#1f1f1f"/>
  </g>

  <!-- floor plant (left corner) -->
  <path d="M120 600 l44 0 l-8 70 l-28 0 z" fill="#c56b4a"/>
  <path d="M142 600 C120 540 96 532 108 505 C122 540 150 548 142 505 C168 536 176 566 162 600 Z" fill="#5f9a5f"/>
  <path d="M142 600 C164 548 196 540 188 512 C200 548 182 578 142 600 Z" fill="#4f864f"/>
</svg>
