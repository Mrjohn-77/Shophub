name: Deploy to Angsila

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rsync and sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to Angsila via SFTP (rsync over SSH)
        env:
          SSHPASS: ${{ secrets.ANGSILA_PASS }}
        run: |
          sshpass -e rsync -rltzv \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='secret' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./ "${{ secrets.ANGSILA_USER }}@angsila.informatics.buu.ac.th:/home/BUU/68160397/public_html/shophub/"
